    <link

    <title>El Pollo Loco</title>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/statusbar-health.class.js"></script>
    <script src="models/statusbar-coin.class.js"></script>

  <body onload="init()">
    <div id="game-wrapper">
      
        <div id="start-screen">
        <!-- <h1>El pollo loco</h1> -->
        <button id="start-btn">Start Game</button>
      </div>

      <canvas id="canvas" width="720" height="480"></canvas>

      <div id="game-over-screen">
        <img src="./img/You won, you lost/Game Over.png" alt="Game Over" />
        <button onclick="restartGame()">Restart</button>
      </div>

      <div id="victory-screen" class="end-screen">
        <img src="img/You won, you lost/You Win A.png" alt="You Win" />
        <button onclick="restartGame()">Restart</button>
      </div>
      
    </div>
